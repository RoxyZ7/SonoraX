name: SonoraX release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release version, without the v prefix
        required: true
        default: 0.48.2

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build SonoraX
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $env:CARGO_PROFILE_RELEASE_LTO = 'off'
          $env:CARGO_PROFILE_RELEASE_CODEGEN_UNITS = '16'
          $env:CARGO_PROFILE_RELEASE_OPT_LEVEL = '2'
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { $env:RELEASE_VERSION }
          $env:SONORA_VERSION = $version
          cargo build --release --locked --package sonora --target x86_64-pc-windows-msvc --config 'profile.release.package.gpui.codegen-units=1'
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/sonora.exe dist/SonoraX-x86_64-pc-windows-msvc.exe
          choco install innosetup --yes --no-progress
          $env:SONORA_EXE = (Resolve-Path 'target/x86_64-pc-windows-msvc/release/sonora.exe').Path
          $env:SONORA_DIST = (Resolve-Path 'dist').Path
          $env:SONORA_ARCH = 'x64compatible'
          $env:SONORA_SETUP = 'SonoraX-Setup'
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" 'scripts/windows/sonora.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          Copy-Item THIRD-PARTY.md dist/SonoraX-THIRD-PARTY.md
          Copy-Item COPYING dist/LICENSE
          Get-FileHash dist/* -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist/SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
          generate_release_notes: true
          files: dist/*
